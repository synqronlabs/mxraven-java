<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mxRaven Java SDK</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    main { max-width: 40rem; padding: 2rem; }
    h1 { margin-bottom: 0.25rem; }
    p { color: #6b7280; margin-top: 0; }
    ul { list-style: none; padding: 0; display: grid; gap: 0.75rem; }
    a.card {
      display: block;
      padding: 1rem 1.25rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      text-decoration: none;
      color: inherit;
    }
    a.card:hover { border-color: #6366f1; }
    a.card strong { color: #6366f1; }
    a.card span { display: block; color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>mxRaven Java SDK</h1>
    <p>API documentation</p>
    <ul>
      <li>
        <a class="card" href="mail/index.html">
          <strong>mxraven-mail</strong>
          <span>SMTP submission, MIME, webhooks, and feedback</span>
        </a>
      </li>
      <li>
        <a class="card" href="admin/index.html">
          <strong>mxraven-admin</strong>
          <span>Control-plane REST API client</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
